name: ipo-alert

on:
  # 자동 실행은 껐다. Gmail 앱 비밀번호 로그인이 GitHub 서버에서 계속 거절되어,
  # 매주 발송은 Claude 루틴(Gmail 연결)으로 옮겼다. 수동 실행만 남긴다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "메일 대신 로그에 본문 출력"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ipo-alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python send.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ipo-alert/logs/
          retention-days: 30
